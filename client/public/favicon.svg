<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Isometric Qubix Cube -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="50,15 82,33 50,51 18,33" fill="url(#topGrad)" stroke="#10B981" stroke-width="1.5" />
    <!-- Left Face -->
    <polygon points="18,33 50,51 50,85 18,67" fill="url(#leftGrad)" stroke="#047857" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="50,51 82,33 82,67 50,85" fill="url(#rightGrad)" stroke="#0284C7" stroke-width="1.5" />
  </g>

  <!-- Tech Accent Node -->
  <circle cx="50" cy="51" r="4" fill="#FFFFFF" opacity="0.9" />
  <circle cx="50" cy="51" r="7" stroke="#34D399" stroke-width="1.5" opacity="0.6" />
</svg>
